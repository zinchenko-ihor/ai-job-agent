services:

  # =========================================================
  # Main Telegram bot application
  # =========================================================

  ai-job-agent:
    image: jumper93/ai-job-agent:${APP_VERSION:-latest}

    container_name: ai-job-agent

    restart: unless-stopped

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./storage:/app/storage

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import app; print('healthy')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  # =========================================================
  # Automatic job collector
  # =========================================================

  job-collector:
    image: jumper93/ai-job-agent:${APP_VERSION:-latest}

    container_name: ai-job-agent-collector

    restart: unless-stopped

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./storage:/app/storage

    command:
      [
        "sh",
        "-c",
        "while true; do echo '=== JOB COLLECTION START ==='; python -m scripts.collect_jobs; echo '=== JOB COLLECTION END ==='; sleep 21600; done"
      ]
