name: CD

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on:
      - self-hosted
      - production

    # Deploy only if CI/CD completed successfully
    if: >
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Verify Docker
      # ---------------------------------------------------------
      - name: Check Docker
        run: |
          docker --version
          docker compose version
          docker info

      # ---------------------------------------------------------
      # 3. Login to Docker Hub
      # ---------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------
      # 4. Pull latest production image
      # ---------------------------------------------------------
      - name: Pull latest image
        run: |
          docker pull jumper93/ai-job-agent:latest

      # ---------------------------------------------------------
      # 5. Deploy application
      # ---------------------------------------------------------
      - name: Deploy application
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      # ---------------------------------------------------------
      # 6. Show container status
      # ---------------------------------------------------------
      - name: Check containers
        run: |
          docker compose ps

      # ---------------------------------------------------------
      # 7. Wait for application startup
      # ---------------------------------------------------------
      - name: Wait for application
        run: |
          echo "Waiting for application to start..."
          sleep 10

      # ---------------------------------------------------------
      # 8. Verify container is running
      # ---------------------------------------------------------
      - name: Health check
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' ai-job-agent)" != "true" ]; then
            echo "Container is not running!"
            docker compose logs --tail=100
            exit 1
          fi

          echo "Application is running successfully."

      # ---------------------------------------------------------
      # 9. Show application logs
      # ---------------------------------------------------------
      - name: Show recent logs
        run: |
          docker compose logs --tail=50 ai-job-agent
