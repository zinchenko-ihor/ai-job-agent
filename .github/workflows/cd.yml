name: CD

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production

    runs-on:
      - self-hosted
      - production

    if: >
      github.event.workflow_run.conclusion == 'success'

    steps:

      # ---------------------------------------------------------
      # 1. Go to production application directory
      # ---------------------------------------------------------
      - name: Go to production directory
        run: |
          cd /home/zincheis/projects/ai-job-agent

          echo "Production directory:"
          pwd

          echo
          echo "Files:"
          ls -la

      # ---------------------------------------------------------
      # 2. Verify production environment
      # ---------------------------------------------------------
      - name: Verify production environment
        working-directory: /home/zincheis/projects/ai-job-agent
        run: |
          if [ ! -f .env ]; then
            echo "ERROR: Production .env not found!"
            exit 1
          fi

          if [ ! -f docker-compose.yml ]; then
            echo "ERROR: docker-compose.yml not found!"
            exit 1
          fi

          echo "Production environment is OK."

      # ---------------------------------------------------------
      # 3. Login to Docker Hub
      # ---------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------
      # 4. Pull latest image
      # ---------------------------------------------------------
      - name: Pull latest image
        working-directory: /home/zincheis/projects/ai-job-agent
        run: |
          docker pull jumper93/ai-job-agent:latest

      # ---------------------------------------------------------
      # 5. Deploy
      # ---------------------------------------------------------
      - name: Deploy application
        working-directory: /home/zincheis/projects/ai-job-agent
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      # ---------------------------------------------------------
      # 6. Show container status
      # ---------------------------------------------------------
      - name: Check containers
        working-directory: /home/zincheis/projects/ai-job-agent
        run: |
          docker compose ps

      # ---------------------------------------------------------
      # 7. Wait for startup
      # ---------------------------------------------------------
      - name: Wait for application
        run: |
          echo "Waiting for application startup..."
          sleep 10

      # ---------------------------------------------------------
      # 8. Health check
      # ---------------------------------------------------------
      - name: Health check
        working-directory: /home/zincheis/projects/ai-job-agent
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' ai-job-agent)" != "true" ]; then
            echo "ERROR: ai-job-agent container is not running!"
            docker compose logs --tail=100 ai-job-agent
            exit 1
          fi

          echo "ai-job-agent is running."

      # ---------------------------------------------------------
      # 9. Show logs
      # ---------------------------------------------------------
      - name: Show recent logs
        working-directory: /home/zincheis/projects/ai-job-agent
        run: |
          docker compose logs --tail=50 ai-job-agent
