name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          TELEGRAM_BOT_TOKEN: test-token
          OLLAMA_HOST: http://localhost:11434
          OLLAMA_MODEL: qwen2.5:3b
        run: |
          pytest -q


  release:
    name: Create release and Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          git fetch --tags

          LAST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            VERSION="1.0.0"
          else
            LAST_VERSION="${LAST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"

            PATCH=$((PATCH + 1))

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Next version: ${VERSION}"

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "Release $VERSION" \
            --generate-notes

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            -t jumper93/ai-job-agent:${VERSION} \
            -t jumper93/ai-job-agent:latest \
            .

      - name: Push Docker images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push jumper93/ai-job-agent:${VERSION}
          docker push jumper93/ai-job-agent:latest

      - name: Show released version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "======================================"
          echo "Release: ${VERSION}"
          echo "Docker: jumper93/ai-job-agent:${VERSION}"
          echo "Docker: jumper93/ai-job-agent:latest"
          echo "======================================"
